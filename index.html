<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linear SVM | Breast Cancer Classification</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f7fc;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #183b64;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .badge {
            display: inline-block;

            margin-top: 12px;

            padding: 6px 13px;

            background: #e9f2ff;
            color: #2866a5;

            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d5dce5;
            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            outline: none;

            border-color: #2866a5;

            box-shadow: 0 0 0 3px rgba(40,102,165,0.1);
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 8px;

            border: none;
            border-radius: 8px;

            background: #183b64;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #2866a5;
        }

        .result {
            margin-top: 25px;

            padding: 20px;

            text-align: center;

            background: #edf5ff;

            border: 1px solid #cfe2fa;
            border-radius: 10px;
        }

        .result p {
            font-size: 13px;
            color: #666;

            margin-bottom: 5px;
        }

        .result h2 {
            color: #183b64;
            font-size: 25px;
        }

        .error {
            margin-top: 20px;

            padding: 13px;

            background: #fff0f0;

            border-radius: 8px;

            text-align: center;

            color: #c62828;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #eee;

            color: #999;

            font-size: 11px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- Header -->

    <div class="header">

        <h1>Linear SVM</h1>

        <p>
            Breast Cancer Classification System
        </p>

        <span class="badge">
            Machine Learning Experiment
        </span>

    </div>


    <!-- Input Form -->

    <form action="/predict" method="POST">


        <div class="input-group">

            <label>
                Mean Radius
            </label>

            <input
                type="number"
                step="any"
                name="radius"
                placeholder="Example: 14.5"
                value="{{ radius if radius is defined else '' }}"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Mean Texture
            </label>

            <input
                type="number"
                step="any"
                name="texture"
                placeholder="Example: 20.0"
                value="{{ texture if texture is defined else '' }}"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Mean Perimeter
            </label>

            <input
                type="number"
                step="any"
                name="perimeter"
                placeholder="Example: 95.0"
                value="{{ perimeter if perimeter is defined else '' }}"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Mean Area
            </label>

            <input
                type="number"
                step="any"
                name="area"
                placeholder="Example: 650"
                value="{{ area if area is defined else '' }}"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Mean Concavity
            </label>

            <input
                type="number"
                step="any"
                name="concavity"
                placeholder="Example: 0.08"
                value="{{ concavity if concavity is defined else '' }}"
                required
            >

        </div>


        <button type="submit">
            Predict Result
        </button>


    </form>


    <!-- Prediction Result -->

    {% if prediction_text %}

    <div class="result">

        <p>Prediction Result</p>

        <h2>
            {{ prediction_text }}
        </h2>

    </div>

    {% endif %}


    <!-- Error -->

    {% if error_text %}

    <div class="error">

        {{ error_text }}

    </div>

    {% endif %}


    <!-- Footer -->

    <div class="footer">

        Linear Support Vector Machine (SVM)
        <br>
        Machine Learning Classification Project

    </div>


</div>


</body>

</html>
